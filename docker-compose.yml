services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmesms
      POSTGRES_PASSWORD: pmesms
      POSTGRES_DB: pmesms
    volumes:
      - pmesms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmesms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "flask db upgrade && gunicorn -c gunicorn.conf.py wsgi:app"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery beat --loglevel=info

volumes:
  pmesms_db_data:
